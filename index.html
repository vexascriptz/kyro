}.social svg{width:16px;height:16px;color:#c5c5c5;flex:none}.social .arrow{width:11px;height:11px;color:#777}.social:hover{color:#fff}.social:hover svg{color:#fff;filter:drop-shadow(0 0 5px #fff6)}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#202020;border:1px solid #3d3d3d;border-radius:7px;padding:10px 15px;color:#fff;font-size:12px;white-space:nowrap;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}.enter{animation:enter .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0ms)}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:400px){.shell{width:calc(100% - 36px);padding-top:55px}.intro{margin-bottom:35px}.intro h1{font-size:40px}.project{gap:11px}.socials{gap:14px}.social{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
let timer;function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2300)}

</script>
